# 词典全流程:Kaggle 上扫描、注音、构建,通过门禁后发 Release,再触发主仓基准。
# 全量要跑十来个小时,作业快到 6 小时上限时重新触发自己,pipeline.py 接上进行中的内核。
name: pipeline

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release 标签
        required: true
      default:
        description: main.pyd 用哪一档(多字词条数)
        required: true
        default: "600000"
      hours:
        description: 注音时长
        required: true
        default: "3"
      cc:
        description: 重扫 Common Crawl(默认用数据集里的统计)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: pipeline-${{ inputs.tag }}

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      again: ${{ steps.build.outputs.again }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TIER: ${{ inputs.default }}
      HOURS: ${{ inputs.hours }}
      CC: ${{ inputs.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # kaggle 漏声明了 six。
      - run: pipx install kaggle && pipx inject kaggle six
      - name: 云端构建
        id: build
        run: |
          code=0
          python3 cloud/pipeline.py --tag "$TAG" --default "$TIER" --hours "$HOURS" --budget 330 --out dist \
            ${{ inputs.cc && '--cc' || '' }} || code=$?
          if [ "$code" = 75 ]; then
            echo "again=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: 续跑
        if: steps.build.outputs.again == 'true'
        run: gh workflow run pipeline.yml --ref main -f tag="$TAG" -f default="$TIER" -f hours="$HOURS" -f cc="$CC"
      - name: 发布
        if: steps.build.outputs.again != 'true'
        run: |
          gh release create "$TAG" --prerelease --title "$TAG" --notes "pipeline 自动构建" \
            dist/main*.pyd dist/collocation.bin dist/build_report.json

  bench:
    needs: cloud
    if: needs.cloud.outputs.again != 'true'
    uses: ukjent7/lueying/.github/workflows/dict-bench.yml@main
    with:
      tag: ${{ inputs.tag }}
      tiers: 200k 400k 600k 800k
